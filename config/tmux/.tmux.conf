# =============================================================================
# tmux configuration for agent / long-running terminal work
# =============================================================================

# --- General Settings ---
set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g display-time 4000
set -g focus-events on

# Use 256 colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Renumber windows when one is closed
set -g renumber-windows on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# --- Prefix Key ---
# Keep default Ctrl+b for now. Can change later if desired.
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# --- Status Bar ---
set -g status on
set -g status-interval 5
set -g status-style bg=colour235,fg=colour250
set -g status-left-length 40
set -g status-right-length 80

set -g status-left  '#[fg=colour81,bold] #S #[fg=colour250]| '
set -g status-right '#[fg=colour245]%Y-%m-%d %H:%M #[fg=colour81]• #[fg=colour245]#h'

# Window status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '
setw -g window-status-current-style bg=colour81,fg=colour235,bold

# --- Keybindings ---

# Reload config easily
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Switch panes with Alt + arrow keys (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Switch windows with Alt + number (no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Copy mode improvements
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Useful for shared sessions ---
# Allow multiple people to attach to the same session without killing each other
set -g aggressive-resize off
set -g allow-rename off
